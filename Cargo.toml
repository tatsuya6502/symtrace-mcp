[package]
name = "symtrace-mcp"
version = "0.5.0"
description = "MCP server that bridges LSP capabilities to AI coding assistants"
repository = "https://github.com/tatsuya6502/symtrace-mcp"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"

[dependencies]
async-trait = "0.1"
clap = { version = "4.6.1", features = ["derive"] }
moka = { version = "0.12", features = ["future"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "io-std", "time"] }
toml = "1.1.2"
turso = "0.6.0"
url = "2"

[features]
integration-rust = []
integration-typescript = []
integration = ["integration-rust", "integration-typescript"]

[dev-dependencies]
filetime = "0.2"
mockall = "0.14"
tempfile = "3.27.0"
which = "7"
